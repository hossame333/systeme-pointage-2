<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pointage</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--ac:#22c55e}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:460px;text-align:center}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:12px}
.cam{border-radius:12px;overflow:hidden;background:#000}video{width:100%;display:block;transform:scaleX(-1)}
input,button{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:0;font-size:16px}
button{background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
#msg{margin-top:12px;font-size:20px;min-height:30px}
a{color:#94a3b8;font-size:13px;display:inline-block;margin-top:12px}
</style></head><body><main>
<h1 id="t"></h1>
<div class="card"><div class="cam"><video id="v" autoplay muted playsinline></video></div>
<div id="adm" hidden><input id="pin" type="password" placeholder="Code admin"><input id="nom" placeholder="Smiya dyal l'employé"><button id="add">Sjjel wjh</button></div>
<div id="msg">Tchargi...</div></div>
<a id="sw"></a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
<script>
const URL_API='COLLE_ICI_URL_APPS_SCRIPT';
const M='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
const $=id=>document.getElementById(id);
const admin=location.hash==='#admin';
const opt=new faceapi.TinyFaceDetectorOptions({inputSize:320});
const det=()=>faceapi.detectSingleFace($('v'),opt).withFaceLandmarks(true).withFaceDescriptor();
const api=async b=>(await fetch(URL_API,{method:'POST',body:JSON.stringify(b)})).json();
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function init(){
  $('t').textContent=admin?'Admin : Inscription':'Marhba bik 3afak';
  $('sw').href=admin?'#':'#admin';
  $('sw').textContent=admin?'← Page pointage':'Admin';
  $('sw').onclick=()=>setTimeout(()=>location.reload());
  $('adm').hidden=!admin;
  try{
    await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(M),faceapi.nets.faceLandmark68TinyNet.loadFromUri(M),faceapi.nets.faceRecognitionNet.loadFromUri(M)]);
    $('v').srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    await $('v').play();
    admin?initAdmin():initPointage();
  }catch(e){$('msg').textContent='Camera wla internet machi khddama';}
}

function initAdmin(){
  $('msg').textContent='Wjh dyal l\'employé f l\'camera, men b3d dghat "Sjjel wjh"';
  $('add').onclick=async()=>{
    const nom=$('nom').value.trim();
    if(!nom||!$('pin').value) return $('msg').textContent='Kteb smiya w code';
    $('msg').textContent='Tsanna...';
    const ds=[];
    for(let i=0;i<4;i++){const r=await det();if(r)ds.push(Array.from(r.descriptor));await wait(400);}
    if(ds.length<3) return $('msg').textContent='Wjh ma banch mzyan, 3awd';
    const avg=ds[0].map((_,i)=>+(ds.reduce((s,d)=>s+d[i],0)/ds.length).toFixed(4));
    try{const r=await api({action:'add',pin:$('pin').value,nom,d:avg});
      $('msg').textContent=r.ok?'✅ '+nom+' tsjjel':'❌ '+(r.err||'Erreur');
      if(r.ok)$('nom').value='';
    }catch(e){$('msg').textContent='❌ Erreur reseau';}
  };
}

async function initPointage(){
  const list=await (await fetch(URL_API)).json();
  if(!list.length) return $('msg').textContent='Ma kayn 7ta employé msjjel';
  const lm=list.map(e=>new faceapi.LabeledFaceDescriptors(e.nom,[new Float32Array(JSON.parse(e.d))]));
  const fm=new faceapi.FaceMatcher(lm,0.5),last={};
  $('msg').textContent='Scanner wjhak...';
  setInterval(async()=>{
    const r=await det(); if(!r) return;
    const m=fm.findBestMatch(r.descriptor);
    if(m.label==='unknown') return $('msg').textContent='Wjh ma t3rfch';
    if(Date.now()-(last[m.label]||0)<60000) return;
    last[m.label]=Date.now();
    $('msg').textContent='Marhba '+m.label+' ✅ tsjjlat';
    api({action:'pointage',nom:m.label});
  },800);
}
init();
</script></body></html>
